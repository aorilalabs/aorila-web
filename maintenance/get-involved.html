  <script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      background: #000000;
      color: #ffffff;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .topspace { flex: 0 0 auto; height: clamp(40px, 9vh, 81px); }
    .docs {
      flex: 1 1 auto;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 clamp(20px, 3vw, 48px);
    }
    /* ---- Tab bar ---- */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #000000;
      display: flex;
      gap: 4px;
      margin-top: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs [role="tab"] {
      flex: 1 0 auto;
      appearance: none;
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 12px 14px 11px;
      font: inherit;
      font-size: 12.5px;
      white-space: nowrap;
      color: #9c9c9c;
      cursor: pointer;
      text-align: center;
    }
    .tabs [role="tab"] .num { color: #5f5f5f; margin-right: 8px; font-size: 11px; }
    .tabs [role="tab"]:hover { color: #ffffff; }
    .tabs [role="tab"]:hover .num { color: #bdbdbd; }
    .tabs [role="tab"][aria-selected="true"] { color: #ffffff; border-bottom-color: #ffffff; }
    .tabs [role="tab"][aria-selected="true"] .num { color: #bdbdbd; }
    .tabs [role="tab"]:focus-visible { outline: 1px solid #ffffff; outline-offset: -1px; }
    /* ---- Panels ---- */
    .panel { padding: 36px 0 8px; }
    .panel[hidden] { display: none; }
    .kicker {
      margin: 0 0 10px 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: #7f7f7f;
    }
    .panel h2 {
      margin: 0 0 8px 0;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(24px, 3.4vw, 34px);
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .details {
      margin-top: 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 20px 20px 18px;
      background: #000000;
    }
    .none { margin: 0; font-size: 13px; color: #7f7f7f; }
    .items { display: flex; flex-direction: column; gap: 14px; margin: 0 0 4px; }
    .item-title { font-size: 13px; color: #ffffff; }
    .item-detail { margin-top: 4px; font-size: 12px; color: #9c9c9c; line-height: 1.5; }
    .action { margin: 16px 0 0 0; font-size: 13px; }
    .action a {
      color: #e8e8e8;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(255, 255, 255, 0.4);
    }
    .action a:hover { color: #ffffff; text-decoration-color: #ffffff; }
    .links { margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .links a {
      font-size: 13px;
      color: #e8e8e8;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(255, 255, 255, 0.4);
    }
    .links a:hover { color: #ffffff; text-decoration-color: #ffffff; }
    .links .net { font-size: 13px; color: #e8e8e8; }
    footer {
      flex: 0 0 auto;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px clamp(20px, 3vw, 48px) 21px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: #7f7f7f;
    }
    footer a { color: #7f7f7f; text-decoration: none; }
    footer a:hover { color: #ffffff; }
    @media (max-width: 700px) {
      .topspace { height: 40px; }
      .tabs { margin-left: calc(-1 * clamp(20px, 3vw, 48px)); margin-right: calc(-1 * clamp(20px, 3vw, 48px)); padding: 0 clamp(20px, 3vw, 48px); }
      .tabs [role="tab"] { padding: 12px 12px 11px; font-size: 12px; text-align: left; }
    }
  </style>
</head>
<body>
  <div class="topspace" aria-hidden="true"></div>
  <main class="docs">
    <div class="tabs" role="tablist" aria-label="Get involved sections">
      <button role="tab" id="tab-challenges" aria-controls="panel-challenges" aria-selected="true" data-tab="challenges">Open Challenges</button>
      <button role="tab" id="tab-beta" aria-controls="panel-beta" aria-selected="false" data-tab="beta" tabindex="-1">Beta Testing</button>
      <button role="tab" id="tab-careers" aria-controls="panel-careers" aria-selected="false" data-tab="careers" tabindex="-1">Careers</button>
      <button role="tab" id="tab-community" aria-controls="panel-community" aria-selected="false" data-tab="community" tabindex="-1">Community</button>
      <button role="tab" id="tab-researchers" aria-controls="panel-researchers" aria-selected="false" data-tab="researchers" tabindex="-1">Researchers</button>
    </div>

    <section class="panel" role="tabpanel" id="panel-challenges" aria-labelledby="tab-challenges">
      <div class="details">
      </div>
    </section>

    <section class="panel" role="tabpanel" id="panel-beta" aria-labelledby="tab-beta">
      <div class="details">
        <p class="action"><a href="mailto:info@aorila.com?subject=Beta%20access%20request">Request beta access</a></p>
      </div>
    </section>

    <section class="panel" role="tabpanel" id="panel-careers" aria-labelledby="tab-careers">
      <div class="details">
        <p class="action"><a href="mailto:info@aorila.com?subject=Introduction">Introduce yourself</a></p>
      </div>
    </section>

    <section class="panel" role="tabpanel" id="panel-community" aria-labelledby="tab-community">
      <div class="details">
        <div class="links" data-community-links>
          <!-- Real hrefs get added here when Nicholas sends the URLs. -->
          <span class="net">Discord</span>
          <span class="net">Twitter</span>
          <span class="net">Facebook</span>
        </div>
      </div>
    </section>

    <section class="panel" role="tabpanel" id="panel-researchers" aria-labelledby="tab-researchers">
      <div class="details">
        <p class="action" style="margin-top:0"><a href="mailto:info@aorila.com?subject=Research%20collaboration">Email the lab</a></p>
      </div>
    </section>
  </main>
  <footer>
    <span>&copy; 2026 Aorila Labs</span>
    <a href="/">&larr; Home</a>
  </footer>
  <script>
    (function () {
      /* ---- Open items: add entries here and they render as lists.
         Leave an array empty and its panel shows the "none" message. ---- */
      var OPEN_CHALLENGES = []; /* { title: '...', detail: '...' } */
      var BETA_TESTS = [];      /* { title: '...', detail: '...' } */
      var OPEN_ROLES = [];      /* { title: '...', detail: '...' } */
      var EMPTY_TEXT = {
        challenges: 'No challenges available at this time.',
        beta: 'No beta tests available at this time.',
        careers: 'No positions available at this time.'
      };
      function renderEmptyState(panelId, items) {
        var panel = document.getElementById('panel-' + panelId);
        if (!panel) return;
        var box = panel.querySelector('.details');
        if (!box) return;
        var wrap = document.createElement('div');
        wrap.className = 'items';
        if (items.length) {
          items.forEach(function (it) {
            var el = document.createElement('div');
            var t = document.createElement('div');
            t.className = 'item-title';
            t.textContent = it.title || '';
            el.appendChild(t);
            if (it.detail) {
              var d = document.createElement('div');
              d.className = 'item-detail';
              d.textContent = it.detail;
              el.appendChild(d);
            }
            wrap.appendChild(el);
          });
        } else {
          var p = document.createElement('p');
          p.className = 'none';
          p.textContent = EMPTY_TEXT[panelId];
          wrap.appendChild(p);
        }
        box.insertBefore(wrap, box.firstChild);
      }
      renderEmptyState('challenges', OPEN_CHALLENGES);
      renderEmptyState('beta', BETA_TESTS);
      renderEmptyState('careers', OPEN_ROLES);

      var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
      var panels = {};
      tabs.forEach(function (t) {
        panels[t.getAttribute('data-tab')] = document.getElementById('panel-' + t.getAttribute('data-tab'));
      });
      function activate(id, push) {
        if (!panels[id]) return;
        tabs.forEach(function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
          panels[t.getAttribute('data-tab')].hidden = !on;
        });
        var url = '?section=' + encodeURIComponent(id);
        if (push) { history.pushState(null, '', url); }
        else { history.replaceState(null, '', url); }
      }
      tabs.forEach(function (t, i) {
        t.addEventListener('click', function () { activate(t.getAttribute('data-tab'), true); });
        t.addEventListener('keydown', function (ev) {
          var j = null;
          if (ev.key === 'ArrowRight') j = (i + 1) % tabs.length;
          else if (ev.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
          else if (ev.key === 'Home') j = 0;
          else if (ev.key === 'End') j = tabs.length - 1;
          if (j !== null) {
            ev.preventDefault();
            tabs[j].focus();
            activate(tabs[j].getAttribute('data-tab'), true);
          }
        });
      });
      var m = /[?&]section=([a-z]+)/.exec(location.search);
      activate(m && panels[m[1]] ? m[1] : 'challenges', false);
    })();
  </script>
</body>
</html>
