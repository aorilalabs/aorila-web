      .wl-cols { column-gap: 9px; }
      .wl-cols button { font-size: 10px; }
      .wl-pages { font-size: 10px; gap: 14px; }

  <script type="application/json" id="wl-data">[{"date":"2026-09-24","project":"ER-AI","run":"run 18","status":"eval up","slug":"2026-09-24-er-ai-run-18"},{"date":"2026-09-23","project":"ER-AI","run":"run 17","status":"latent drift","slug":"2026-09-23-er-ai-run-17"},{"date":"2026-09-22","project":"Atraly adapter","run":"","status":"v0.4","slug":"2026-09-22-atraly-adapter"},{"date":"2026-09-21","project":"ER-AI","run":"run 16","status":"stability","slug":"2026-09-21-er-ai-run-16"},{"date":"2026-09-20","project":"memory bank","run":"","status":"compress","slug":"2026-09-20-memory-bank"},{"date":"2026-09-19","project":"robot planner","run":"","status":"sim","slug":"2026-09-19-robot-planner"},{"date":"2026-09-18","project":"Atraly adapter","run":"","status":"train patch","slug":"2026-09-18-atraly-adapter"},{"date":"2026-09-17","project":"ER-AI","run":"run 15","status":"eval","slug":"2026-09-17-er-ai-run-15"}]</script>
  <script>
    (function () {
      'use strict';
      var dataEl = document.getElementById('wl-data');
      var rowsEl = document.getElementById('wl-rows');
      if (!dataEl || !rowsEl) return;
      var entries;
      try { entries = JSON.parse(dataEl.textContent); } catch (e) { return; }
      if (!Array.isArray(entries)) return;
      var searchBtn = document.getElementById('wl-searchbtn');
      var searchWrap = document.getElementById('wl-search');
      var searchInput = document.getElementById('wl-q');
      var pagesEl = document.getElementById('wl-pages');
      var sortKey = null;
      var sortDir = 1;
      var page = 1;
      var PER_PAGE = 10;
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function rowHtml(e) {
        var href = '/work-log/' + e.slug + '/';
        return '<div class="wl-row">' +
          '<a href="' + href + '">' + esc(e.date) + '</a>' +
          '<a href="' + href + '">' + esc(e.project) + '</a>' +
          '<a href="' + href + '" class="r">' + esc(e.run) + '</a>' +
          '<a href="' + href + '" class="r">' + esc(e.status) + '</a></div>';
      }
      function pageWindow(cur, total) {
        var nums = [];
        if (total <= 7) {
          for (var i = 1; i <= total; i++) nums.push(i);
          return nums;
        }
        nums.push(1);
        var lo = Math.max(2, cur - 1), hi = Math.min(total - 1, cur + 1);
        if (lo > 2) nums.push('…');
        for (var j = lo; j <= hi; j++) nums.push(j);
        if (hi < total - 1) nums.push('…');
        nums.push(total);
        return nums;
      }
      function renderPages(totalPages) {
        if (!pagesEl) return;
        if (totalPages <= 1) { pagesEl.setAttribute('hidden', ''); pagesEl.innerHTML = ''; return; }
        pagesEl.removeAttribute('hidden');
        var html = '<button type="button" data-pg="prev"' + (page <= 1 ? ' disabled' : '') + '>&larr; Prev</button>';
        pageWindow(page, totalPages).forEach(function (n) {
          if (n === '…') { html += '<span aria-hidden="true">&hellip;</span>'; return; }
          html += '<button type="button" data-pg="' + n + '"' + (n === page ? ' class="pg-cur" aria-current="page"' : '') + '>' + n + '</button>';
        });
        html += '<button type="button" data-pg="next"' + (page >= totalPages ? ' disabled' : '') + '>Next &rarr;</button>';
        pagesEl.innerHTML = html;
      }
      function render() {
        var q = searchInput.value.trim().toLowerCase();
        var list = entries.filter(function (e) {
          if (!q) return true;
          return (e.date + ' ' + e.project + ' ' + e.run + ' ' + e.status).toLowerCase().indexOf(q) !== -1;
        });
        if (sortKey) {
          list = list.slice().sort(function (a, b) {
            var va = a[sortKey] || '', vb = b[sortKey] || '', c;
            if (sortKey === 'date') c = va < vb ? -1 : va > vb ? 1 : 0;
            else c = String(va).toLowerCase().localeCompare(String(vb).toLowerCase());
            return c * sortDir;
          });
        }
        if (!list.length) {
          rowsEl.innerHTML = '<div class="wl-row wl-empty"><span>No matches.</span></div>';
          renderPages(1);
          return;
        }
        var totalPages = Math.max(1, Math.ceil(list.length / PER_PAGE));
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        var slice = list.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        rowsEl.innerHTML = slice.map(rowHtml).join('');
        rowsEl.scrollTop = 0;
        renderPages(totalPages);
      }
      var sortBtns = Array.prototype.slice.call(document.querySelectorAll('[data-sort]'));
      sortBtns.forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-sort');
          if (sortKey === k) { sortDir = -sortDir; }
          else { sortKey = k; sortDir = 1; }
          sortBtns.forEach(function (x) {
            x.querySelector('.arr').textContent = '';
            x.setAttribute('aria-sort', 'none');
          });
          b.querySelector('.arr').textContent = sortDir === 1 ? ' \u2191' : ' \u2193';
          b.setAttribute('aria-sort', sortDir === 1 ? 'ascending' : 'descending');
          page = 1;
          render();
        });
      });
      if (pagesEl) {
        pagesEl.addEventListener('click', function (ev) {
          var t = ev.target;
          while (t && t !== pagesEl && t.tagName !== 'BUTTON') t = t.parentNode;
          if (!t || t === pagesEl || t.disabled) return;
          var v = t.getAttribute('data-pg');
          if (v === 'prev') page--;
          else if (v === 'next') page++;
          else page = parseInt(v, 10) || 1;
          render();
        });
      }
      searchBtn.addEventListener('click', function () {
        if (searchWrap.hasAttribute('hidden')) {
          searchWrap.removeAttribute('hidden');
          searchInput.focus();
        } else {
          searchWrap.setAttribute('hidden', '');
          searchInput.value = '';
          render();
        }
      });
      searchInput.addEventListener('input', function () { page = 1; render(); });
      render();
    })();
  </script>
