# ONE web service, ONE deploy. aorilalabs.com is a second custom domain on this
# same service — do not create a second Render service for Labs.
# Host header selects consumer vs Labs pages — see server.js and RENDER.md.
# No secrets required for the marketing site.
services:
  - type: web
    name: aorila
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
