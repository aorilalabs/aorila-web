# One web service. Attach aorila.com + aorilalabs.com (and www) as custom domains.
# Host header selects consumer vs Labs pages — see server.js and RENDER.md.
# No secrets required for the marketing site.
services:
  - type: web
    name: aorila
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
