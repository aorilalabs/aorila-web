# ONE web service, ONE deploy. aorilalabs.com and api.aorila.com are extra
# custom domains on this same service — do not create a second Render service.
# Host header selects consumer vs Labs vs the consumer API face — see
# server.js and RENDER.md. CNAME api.aorila.com to this service’s onrender host.
# No secrets required for the marketing site.
services:
  - type: web
    name: aorila
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: leads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LEADS_PATH
        value: /var/data/leads.json
      # Account data (users, sessions, machines, credits) must survive deploys:
      # the persistent disk is mounted at /var/data.
      - key: DATA_DIR
        value: /var/data/aorila
      # Shared identity with atraly.com. The anon key is public by design
      # (atraly.com serves it to every browser); the server also accepts an
      # override via dashboard env vars for rotation.
      - key: SUPABASE_URL
        value: https://fvxvvilgvplztbmovmxi.supabase.co
