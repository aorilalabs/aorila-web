services:
  - type: web
    name: aorila
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: leads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LEADS_PATH
        value: /var/data/leads.json
      - key: DATA_DIR
        value: /var/data/aorila
      - key: SUPABASE_URL
        value: https://fvxvvilgvplztbmovmxi.supabase.co

  - type: static
    name: aorila-site
    plan: free
    buildCommand: npm install --omit=dev && npm run build:site -- consumer
    staticPublishPath: dist/consumer
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20"

  - type: static
    name: aorila-labs-site
    plan: free
    buildCommand: npm install --omit=dev && npm run build:site -- labs
    staticPublishPath: dist/labs
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20"

  - type: static
    name: aorila-robotics-site
    plan: free
    buildCommand: npm install --omit=dev && npm run build:site -- robotics
    staticPublishPath: dist/robotics
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20"
