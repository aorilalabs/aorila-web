<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aorila Labs — Request API access</title>
  <meta name="description" content="Aorila Labs is the commercial path to Aorila API access. Request access for your team." />
  <meta property="og:title" content="Aorila Labs — Request API access" />
  <meta property="og:description" content="Request commercial API access for your company." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aorilalabs.com/api" />
  <link rel="canonical" href="https://aorilalabs.com/api" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-site="labs" class="labs-home">
  <div class="labs-atmosphere" aria-hidden="true"></div>
  <header class="nav">
    <a class="wordmark" href="/">Aorila <span class="soft">Labs</span></a>
    <nav class="nav-links">
      <a class="nav-link" href="https://aorila.com" data-local-site="consumer">Aorila</a>
    </nav>
  </header>

  <main class="labs-main">
    <section class="labs-intro">
      <p class="brand labs-brand">Aorila Labs</p>
      <h1>Request API access</h1>
      <p class="lede">Tell us about your team and how you plan to use the API. We review every request and follow up by email.</p>
    </section>

    <section id="contact" class="labs-form-panel" aria-label="Request API access">
      <form class="waitlist" action="/leads" method="post" data-kind="contact">
        <input type="hidden" name="site" value="labs" />
        <input type="hidden" name="kind" value="contact" />
        <label class="hp" aria-hidden="true">Fax
          <input type="text" name="fax" tabindex="-1" autocomplete="off" />
        </label>
        <div class="form-grid">
          <label>
            Company
            <input type="text" name="company" autocomplete="organization" required placeholder="Acme Inc." />
          </label>
          <label>
            Contact name
            <input type="text" name="name" autocomplete="name" required placeholder="Jordan Lee" />
          </label>
          <label class="span-2">
            Work email
            <input type="email" name="email" autocomplete="email" required placeholder="you@company.com" />
          </label>
          <label class="span-2">
            Use case
            <textarea name="use_case" rows="3" required placeholder="What will you use the API for?"></textarea>
          </label>
          <label>
            Volume estimate
            <input type="text" name="volume" autocomplete="off" required placeholder="e.g. 10M tokens / month" />
          </label>
          <label>
            Website <span class="optional">optional</span>
            <input type="text" name="website" autocomplete="url" placeholder="https://" />
          </label>
        </div>
        <button class="cta primary" type="submit">Request API access</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="form-alt">Or email <a href="mailto:api@aorila.com">api@aorila.com</a>.</p>
    </section>
  </main>

  <footer>
    <span>Aorila Labs</span>
    <nav class="footer-links" aria-label="Legal">
      <a href="/about">About</a>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
    </nav>
    <span><a href="https://aorila.com" data-local-site="consumer">aorila.com</a></span>
  </footer>
  <script src="/site.js"></script>
</body>
</html>
