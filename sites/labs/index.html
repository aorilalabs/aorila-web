<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aorila Labs — Commercial API access</title>
  <meta name="description" content="Commercial API access for Aorila Labs. Company, contact, use case, and volume. Follow up at api@aorila.com." />
  <meta property="og:title" content="Aorila Labs — Commercial API access" />
  <meta property="og:description" content="Commercial API access for your company." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aorilalabs.com" />
  <link rel="canonical" href="https://aorilalabs.com" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-site="labs">
  <header class="nav">
    <a class="wordmark" href="/">Aorila <span class="soft">Labs</span></a>
    <nav class="nav-links">
      <a class="nav-link" href="https://aorila.com" data-local-site="consumer">Aorila</a>
    </nav>
  </header>

  <main>
    <section id="contact" class="labs-split">
      <div class="labs-split-form">
        <form class="waitlist" action="/leads" method="post" data-kind="contact">
          <input type="hidden" name="site" value="labs" />
          <input type="hidden" name="kind" value="contact" />
          <label class="hp" aria-hidden="true">Fax
            <input type="text" name="fax" tabindex="-1" autocomplete="off" />
          </label>
          <label>
            Company
            <input type="text" name="company" autocomplete="organization" required placeholder="Acme Inc." />
          </label>
          <label>
            Contact name
            <input type="text" name="name" autocomplete="name" required placeholder="Jordan Lee" />
          </label>
          <label>
            Work email
            <input type="email" name="email" autocomplete="email" required placeholder="you@company.com" />
          </label>
          <label>
            Use case
            <textarea name="use_case" rows="4" required placeholder="What will you use the API for?"></textarea>
          </label>
          <label>
            Volume estimate
            <input type="text" name="volume" autocomplete="off" required placeholder="e.g. 10M tokens / month or 50 seats" />
          </label>
          <label>
            Website <span class="optional">optional</span>
            <input type="text" name="website" autocomplete="url" placeholder="https://" />
          </label>
          <button class="cta primary" type="submit">Request access</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
        <p class="form-alt">Or email <a href="mailto:api@aorila.com">api@aorila.com</a>.</p>
      </div>
      <div class="labs-split-copy">
        <h1>Commercial API access</h1>
        <p class="lede">Tell us about your company and how you plan to use the API.</p>
      </div>
    </section>
  </main>

  <footer>
    <nav class="footer-links" aria-label="Legal">
      <a href="/tp">T &amp; P</a>
      <a href="/support">Support</a>
    </nav>
    <span><a href="https://aorilalabs.com" data-local-site="labs">Aorila Labs</a></span>
  </footer>
  <script src="/site.js"></script>
</body>
</html>
